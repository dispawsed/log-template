<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>dispawsed's playlog</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

        <link rel="icon" type="image/png" sizes="192x192" href="favicon.png">

        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="controls-wrapper">
            <button id="lang-toggle" class="control-btn">RU</button>
            <button id="theme-toggle" class="control-btn">☀️</button>
        </div>

        <header class="header">
            <h1 id="main-title">dispawsed's playlog</h1>
            
            <div class="nav-wrapper">
                <nav class="nav-links">
                    <a href="#section-recommended" id="nav-recommended"></a>
                    <a href="#section-playing" id="nav-playing"></a>
                    <a href="#section-want-to-play" id="nav-want-to-play"></a>
                    <a href="#section-not-recommended" id="nav-not-recommended"></a>
                </nav>
                
                <div class="search-container">
                    <input type="text" id="game-search" placeholder="...">
                    <button id="clear-search" class="clear-btn">&times;</button>
                </div>
            </div>
        </header>

        <main class="container">
            <div class="no-results-message" id="no-results-message" style="display: none;"></div>

            <section class="category-section" id="section-recommended">
                <h2 class="section-title" id="title-recommended"></h2>
                <div class="games-grid" id="grid-recommended"></div>
            </section>

            <section class="category-section" id="section-playing">
                <h2 class="section-title" id="title-playing"></h2>
                <div class="games-grid" id="grid-playing"></div>
            </section>

            <section class="category-section" id="section-want-to-play">
                <h2 class="section-title" id="title-want-to-play"></h2>
                <div class="games-grid" id="grid-want-to-play"></div>
            </section>

            <section class="category-section" id="section-not-recommended">
                <h2 class="section-title" id="title-not-recommended"></h2>
                <div class="games-grid" id="grid-not-recommended"></div>
            </section>
        </main>

        <script src="app.js"></script>
    </body>
</html>
