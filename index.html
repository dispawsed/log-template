<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>dispawsed's log template</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

        <link rel="icon" type="image/png" sizes="192x192" href="favicon.png">

        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="controls-wrapper">
            <button id="lang-toggle" class="control-btn">RU</button>
            <button id="theme-toggle" class="control-btn">☀️</button>
        </div>

        <header class="header">
            <h1 id="main-title">dispawsed's log template</h1>
            
            <div class="nav-wrapper">
                <nav class="nav-links">
                    <a href="#section-recommended" id="nav-recommended"></a>
                    <a href="#section-doing-now" id="nav-doing-now"></a>
                    <a href="#section-want-to-do" id="nav-want-to-do"></a>
                    <a href="#section-not-recommended" id="nav-not-recommended"></a>
                </nav>
                
                <div class="search-wrapper">
                    <button id="memories-toggle" class="memories-btn">🧠</button>
                    <div class="search-container">
                        <input type="text" id="items-search" placeholder="...">
                        <button id="clear-search" class="clear-btn">&times;</button>
                    </div>
                </div>
            </div>
        </header>

        <main class="container">
            <div class="no-results-message" id="no-results-message" style="display: none;"></div>

            <section class="category-section" id="section-recommended">
                <h2 class="section-title" id="title-recommended"></h2>
                <div class="items-grid" id="grid-recommended"></div>
            </section>

            <section class="category-section" id="section-doing-now">
                <h2 class="section-title" id="title-doing-now"></h2>
                <div class="items-grid" id="grid-doing-now"></div>
            </section>

            <section class="category-section" id="section-want-to-do">
                <h2 class="section-title" id="title-want-to-do"></h2>
                <div class="items-grid" id="grid-want-to-do"></div>
            </section>

            <section class="category-section" id="section-not-recommended">
                <h2 class="section-title" id="title-not-recommended"></h2>
                <div class="items-grid" id="grid-not-recommended"></div>
            </section>
        </main>

        <footer class="footer">
            <div class="footer-content">
                <p class="footer-copyright" id="footer-copyright">© 2026 dispawsed's log template</p>
                <div class="footer-links" id="footer-links">
                </div>
            </div>
        </footer>

        <script src="app.js"></script>
    </body>
</html>
