<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Игровой Трекер</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1>Моя Игровая Полка</h1>
        <p>Список игр, во что играл и что планирую пройти</p>
        
        <div class="filter-buttons" id="filter-container">
            <button class="btn active" data-filter="all">Все</button>
            <button class="btn" data-filter="recommended">🔥 Рекомендую</button>
            <button class="btn" data-filter="played">🎮 Играл</button>
            <button class="btn" data-filter="want-to-play">⏳ Хочу сыграть</button>
            <button class="btn" data-filter="not-recommended">👎 Не рекомендую</button>
        </div>
    </header>

    <main class="container">
        <div class="games-grid" id="games-grid"></div>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
