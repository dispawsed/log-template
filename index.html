<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title></title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

        <link rel="icon" type="image/png" sizes="192x192" href="favicon.png">

        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="controls-wrapper">
            <button id="lang-toggle" class="control-btn"></button>
            <button id="theme-toggle" class="control-btn"></button>
        </div>

        <header class="header">
            <h1 id="main-title"></h1>
            
            <div class="nav-wrapper">
                <nav class="nav-links" id="categories-links"></nav>
                
                <div class="search-wrapper">
                    <button id="memories-toggle" class="memories-btn">🧠</button>
                    <div class="search-container">
                        <input type="text" id="items-search" placeholder="...">
                        <button id="clear-search" class="clear-btn">&times;</button>
                    </div>
                </div>
            </div>
        </header>

        <main class="container" id="main-container">
            <div class="no-results-message" id="no-results-message" style="display: none;"></div>
        </main>

        <footer class="footer">
            <div class="footer-content">
                <p class="footer-copyright" id="footer-copyright"></p>
                <div class="footer-links" id="footer-links"></div>
            </div>
        </footer>

        <script src="app.js"></script>
    </body>
</html>
